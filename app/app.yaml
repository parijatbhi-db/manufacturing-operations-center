command: ['npm', 'start']

env:
  - name: 'NODE_ENV'
    value: 'production'
  - name: 'DASHBOARD_ID'
    value: '01f13ffb2116152b9c57017ac6989369'
  - name: 'GENIE_SPACE_ID'
    valueFrom: 'genie-space'
  - name: 'AGENT_SERVING_ENDPOINT'
    valueFrom: 'serving-endpoint'
  - name: 'SUPERVISOR_AGENT_TILE_ID'
    value: '40863b57-1699-430c-8335-ee6db4a0c691'
  - name: 'KNOWLEDGE_ASSISTANT_TILE_ID'
    value: 'b49c04e7-8a4b-4c5e-b7a9-6422165f5516'
  - name: 'KNOWLEDGE_ASSISTANT_ENDPOINT'
    value: 'ka-b49c04e7-endpoint'
  - name: 'REFRESH_JOB_ID'
    valueFrom: 'refresh-job'
  # PGHOST/PGPORT/PGDATABASE/PGUSER/PGSSLMODE are auto-injected by the 'lakebase' (postgres)
  # resource; the endpoint path is not, so it must be declared explicitly.
  - name: 'LAKEBASE_ENDPOINT'
    valueFrom: 'lakebase'
  - name: 'LAKEBASE_SYNCED_SCHEMA'
    value: 'mfg_ops'
  - name: 'WORKSPACE_ORG_ID'
    value: '1444828305810485'

# Resources declared so the deploy flow prompts for OBO consent.
# These keys must be wired in the Databricks UI when adding resources to the app.
#
# Resource: Dashboard (Lakeview)
#   key: dashboard
#   id: 01f13ffb2116152b9c57017ac6989369
#   permission: CAN_READ
#
# Resource: Genie Space
#   key: genie-space
#   id: 01f1403396011f339af2cb207b69e9b6
#   permission: CAN_RUN
#
# Resource: Lakebase (postgres) — injects PGHOST/PGDATABASE/PGUSER/LAKEBASE_ENDPOINT
#   key: lakebase
#   branch: projects/parijat-mfg-ops/branches/production
#   permission: CAN_CONNECT_AND_CREATE
#
# Resource: Job (data refresh)
#   key: refresh-job
#   id: 848871296768056
#   permission: CAN_MANAGE_RUN
#
# Resource: Model Serving Endpoint (supervisor agent)
#   key: serving-endpoint
#   name: mas-40863b57-endpoint
#   permission: CAN_QUERY
#
# User authorization scopes required (set in app definition or UI):
#   - dashboards.genie
#   - serving.serving-endpoints
