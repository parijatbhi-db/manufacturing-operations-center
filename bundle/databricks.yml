bundle:
  name: parijat_semi_stdf
include:
- resources/*.yml
variables:
  project_name:
    description: AI Demo Generator Project
    default: semi_stdf
  catalog:
    description: Unity Catalog catalog for all STDF pipeline outputs
    default: parijat_demos
  schema:
    description: Schema that the STDF pipeline owns end to end (raw, silver, gold, metric views, KA docs)
    default: mfg_ops
  volume:
    description: Volume for raw parquet and Knowledge Assistant docs
    default: raw_data
  environment:
    description: Deployment environment
    default: dev
  workspace_path:
    description: Workspace path where bundle files will be synced
    default: /Users/parijat.bhide@databricks.com/semi_stdf
workspace:
  file_path: ${var.workspace_path}
sync:
  include:
  - agent_bricks_service.py
  - utils.py
  - generate_data.py
  - transformations.sql
  - export_kb_docs.py
  - redeploy_agents.py
  - dashboard_test_quality_ops.lvdash.json
targets:
  dev:
    default: true
    mode: production
    workspace:
      root_path: ${var.workspace_path}/.bundle/${bundle.name}
resources:
  schemas:
    mfg_ops:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: STDF wafer-sort / final-test pipeline outputs (raw, silver, gold, wafer-map patterns, metric views). Owned by the parijat_semi_stdf bundle.
  volumes:
    mfg_ops_raw_data:
      name: ${var.volume}
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.mfg_ops.name}
      volume_type: MANAGED
      comment: Raw STDF parquet and regenerated Knowledge Assistant docs
  sql_warehouses:
    mfg_ops_wh:
      name: parijat-mfg-ops
      cluster_size: 2X-Small
      min_num_clusters: 1
      max_num_clusters: 2
      auto_stop_mins: 10
      enable_serverless_compute: true
      enable_photon: true
      warehouse_type: PRO
  jobs:
    demo_workflow:
      name: '[DEMOGEN] - ${var.project_name} - Data Generation and Transformation'
      tasks:
      - task_key: generate_data
        spark_python_task:
          python_file: ./generate_data.py
          source: WORKSPACE
          parameters:
          - --catalog
          - ${var.catalog}
          - --schema
          - ${resources.schemas.mfg_ops.name}
          - --volume
          - ${resources.volumes.mfg_ops_raw_data.name}
        environment_key: default
        max_retries: 1
      - task_key: sql_transformations
        depends_on:
        - task_key: generate_data
        sql_task:
          file:
            path: ./transformations.sql
          warehouse_id: ${resources.sql_warehouses.mfg_ops_wh.id}
          parameters:
            catalog: ${var.catalog}
            schema: ${resources.schemas.mfg_ops.name}
        max_retries: 1
      - task_key: export_kb_docs
        depends_on:
        - task_key: sql_transformations
        spark_python_task:
          python_file: ./export_kb_docs.py
          source: WORKSPACE
          parameters:
          - --catalog
          - ${var.catalog}
          - --schema
          - ${resources.schemas.mfg_ops.name}
          - --volume
          - ${resources.volumes.mfg_ops_raw_data.name}
        environment_key: default
        max_retries: 1
      - task_key: sync_agent_bricks
        depends_on:
        - task_key: export_kb_docs
        spark_python_task:
          python_file: ./redeploy_agents.py
          source: WORKSPACE
          parameters:
          - --docs-path
          - /Volumes/${var.catalog}/${resources.schemas.mfg_ops.name}/${resources.volumes.mfg_ops_raw_data.name}/docs
          - --genie-space-id
          - ${resources.genie_spaces.stdf_genie.id}
        environment_key: agents
        max_retries: 1
      environments:
      - environment_key: default
        spec:
          client: '3'
          dependencies:
          - faker>=19.0.0
          - holidays>=0.35
      - environment_key: agents
        spec:
          client: '3'
          dependencies:
          - databricks-sdk>=0.55.0
  dashboards:
    test_quality_ops:
      display_name: Semiconductor Test Quality and Throughput
      file_path: ./dashboard_test_quality_ops.lvdash.json
      warehouse_id: ${resources.sql_warehouses.mfg_ops_wh.id}
      embed_credentials: false
